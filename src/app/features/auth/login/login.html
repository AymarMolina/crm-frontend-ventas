<div class="page">

  <!-- Panel izquierdo -->
  <div class="left">
    <div class="grid-bg"></div>
    <div class="accent-blob"></div>

    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <span class="brand-name">CRM Ventas</span>
    </div>

  </div>

  <!-- Panel derecho -->
  <div class="right">
    <div class="form-card">
      <h2>Bienvenido</h2>
      <p class="sub">Ingresa tus credenciales para continuar</p>

      <!-- Alerta de error del servidor -->
      @if (errorMsg) {
        <div class="alert">{{ errorMsg }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email -->
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="usuario@crm.com"
            [class.error-input]="email.invalid && email.touched"
          />
          @if (email.invalid && email.touched) {
            <span class="error-msg">Ingresa un correo válido</span>
          }
        </div>

        <!-- Contraseña -->
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pass-wrap">
            <input
              id="password"
              [type]="showPass ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              [class.error-input]="password.invalid && password.touched"
            />
            <button type="button" class="eye-btn" (click)="showPass = !showPass">
              @if (!showPass) {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              } @else {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              }
            </button>
          </div>
          @if (password.invalid && password.touched) {
            <span class="error-msg">Mínimo 6 caracteres</span>
          }
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
          @if (loading) {
            <span class="spinner"></span>
          } @else {
            Ingresar
          }
        </button>
        <p class="back-link">
          <a (click)="irAForgot()">¿Olvidaste tu contraseña?</a>
        </p>

      </form>
    </div>
  </div>
</div>
