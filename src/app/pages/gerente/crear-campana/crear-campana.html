<!-- Spinner de carga -->
<div *ngIf="loading" class="flex justify-center items-center min-h-screen">
  <span class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></span>
</div>

<div *ngIf="!loading" class="p-6 bg-gray-50 min-h-screen">
  
  <div class="max-w-6xl mx-auto mb-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
      <div class="flex items-center gap-4">
        <div>
          <h1 class="text-xl font-bold text-gray-800">Gestión de Campañas</h1>
          <p class="text-xs text-gray-500">Crea o selecciona una campaña para gestionar sus productos</p>
        </div>
      </div>
      
      <!-- FILTROS Y SELECTOR -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2">
          <label class="text-xs font-bold text-gray-400 uppercase">Filtrar:</label>
          <select (change)="filtrarCampanas($any($event.target).value)" 
                  class="border border-gray-200 rounded-lg px-2 py-1.5 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Todas las líneas</option>
            <option *ngFor="let l of lineas" [value]="l.codigo">{{ l.nombre }}</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <select [(ngModel)]="campanaSeleccionadaId" (change)="onSeleccionarCampana()"
                  class="border border-indigo-200 rounded-lg px-3 py-1.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none min-w-[200px] font-medium text-indigo-700">
            <option value="">+ Crear Nueva Campaña</option>
            <option *ngFor="let c of campanasFiltradas" [value]="c.id">
              {{ c.nombre }}
            </option>
          </select>
          
          <button *ngIf="campanaCreadaId" (click)="finalizar()" 
                  class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Volver a crear nuevo">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 max-w-6xl mx-auto">
    
    <!-- COLUMNA 1: DATOS DE CAMPAÑA -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
        <h2 class="font-semibold text-gray-700">1. Configuración de Campaña</h2>
        <span *ngIf="campanaCreadaId" class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold">REGISTRADA</span>
      </div>

      <div class="p-6 space-y-4">
        <!-- Alertas -->
        <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg">{{ error }}</div>
        <div *ngIf="exito" class="bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg">✓ Guardado correctamente.</div>

        <!-- El fieldset se deshabilita SOLO si ya hay una campaña creada/seleccionada -->
        <fieldset [disabled]="campanaCreadaId !== null" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Campaña</label>
            <input type="text" [(ngModel)]="form.nombre" placeholder="Ej: Migraciones Junio"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none disabled:bg-gray-50 disabled:text-gray-500" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Línea</label>
            <select [(ngModel)]="form.lineaId" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white disabled:bg-gray-50">
              <option [value]="0">Seleccione línea...</option>
              <option *ngFor="let l of lineas" [value]="l.id">{{ l.nombre }}</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Mes</label>
              <select [(ngModel)]="form.mes" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white disabled:bg-gray-50">
                <option *ngFor="let m of meses" [value]="m.valor">{{ m.label }}</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Año</label>
              <select [(ngModel)]="form.anio" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white disabled:bg-gray-50">
                <option *ngFor="let a of anios" [value]="a">{{ a }}</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Objetivo Total</label>
            <input type="number" [(ngModel)]="form.objetivoTotal" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm disabled:bg-gray-50" />
          </div>

          <button *ngIf="!campanaCreadaId" (click)="guardar()" [disabled]="guardando || formInvalido"
                  class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-medium py-2.5 rounded-lg transition shadow-sm">
            {{ guardando ? 'Guardando...' : 'Crear Campaña' }}
          </button>
        </fieldset>
      </div>
    </div>

    <!-- COLUMNA 2: GESTIÓN DE PRODUCTOS -->
    <div class="space-y-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all"
           [ngClass]="{'opacity-50 grayscale pointer-events-none': !campanaCreadaId}">
        
        <div class="p-4 border-b border-gray-100 bg-gray-50/50">
          <h2 class="font-semibold text-gray-700">2. Productos en Campaña</h2>
        </div>

        <div class="p-6 space-y-4">
          <input type="text" [(ngModel)]="nuevoProducto.nombre" placeholder="Nombre (Ej: Plan 500MB)"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
          
          <textarea [(ngModel)]="nuevoProducto.descripcion" placeholder="Descripción corta..." rows="2"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>

          <div class="relative">
            <span class="absolute left-3 top-2 text-gray-400 text-sm">S/</span>
            <input type="number" [(ngModel)]="nuevoProducto.precio" 
                   class="w-full border border-gray-300 rounded-lg pl-8 pr-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>

          <button (click)="agregarProducto()" [disabled]="!nuevoProducto.nombre"
                  class="w-full bg-gray-800 hover:bg-black text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center gap-2">
            <span>+ Agregar Producto</span>
          </button>
        </div>

        <!-- Lista de productos añadidos -->
        <div class="p-6 bg-gray-50 border-t border-gray-100" *ngIf="productosAgregados.length > 0">
          <div class="space-y-2 max-h-[300px] overflow-y-auto">
            <div *ngFor="let p of productosAgregados" class="flex justify-between items-center p-3 bg-white border border-gray-200 rounded-lg shadow-sm">
              <div>
                <p class="text-sm font-bold text-gray-800">{{ p.nombre }}</p>
                <p class="text-[10px] text-gray-400">{{ p.descripcion }}</p>
              </div>
              <span class="text-sm font-bold text-indigo-600">S/ {{ p.precio }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
