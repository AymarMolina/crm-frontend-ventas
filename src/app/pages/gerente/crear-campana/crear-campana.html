<!-- Spinner de carga -->
@if (loading) {
  <div class="flex justify-center items-center min-h-screen bg-[#0d0f14]/10">
    <span class="w-10 h-10 border-4 border-white/90 border-t-[#63c896] rounded-full animate-spin"></span>
  </div>
}


<div *ngIf="!loading" class="p-6 bg-slate-50 min-h-screen">
  
  <div class="max-w-6xl mx-auto mb-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200/60 shadow-sm">
      <div class="flex items-center gap-4">
        <div>
          <h1 class="text-xl font-bold text-slate-800 tracking-tight">Gestión de Campañas</h1>
          <p class="text-xs text-slate-500">Crea o selecciona una campaña para gestionar sus productos</p>
        </div>
      </div>
      
      <!-- FILTROS Y SELECTOR -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Filtrar:</label>
          <div class="relative">
            <select (change)="filtrarCampanas($any($event.target).value)" 
                    class="appearance-none border border-slate-200 rounded-lg pl-3 pr-8 py-1.5 text-sm bg-slate-50 text-slate-700 outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all">
              <option value="">Todas las líneas</option>
              <option *ngFor="let l of lineas" [value]="l.codigo">{{ l.nombre }}</option>
            </select>
            <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <div class="relative">
            <select [(ngModel)]="campanaSeleccionadaId" (change)="onSeleccionarCampana()"
                    class="appearance-none border border-indigo-200 rounded-lg pl-3 pr-8 py-1.5 text-sm bg-white focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 outline-none min-w-[200px] font-semibold text-indigo-600 transition-all">
              <option value="">+ Crear Nueva Campaña</option>
              <option *ngFor="let c of campanasFiltradas" [value]="c.id">
                {{ c.nombre }}
              </option>
            </select>
            <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
          
          <button *ngIf="campanaCreadaId" (click)="finalizar()" 
                  class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Volver a crear nuevo">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-6xl mx-auto">
    
    <!-- COLUMNA 1: DATOS DE CAMPAÑA -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-200 bg-slate-50/70 flex justify-between items-center">
        <h2 class="font-bold text-sm uppercase tracking-wider text-slate-600">1. Configuración de Campaña</h2>
        <span *ngIf="campanaCreadaId" class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Registrada</span>
      </div>

      <div class="p-6 space-y-4">
        <!-- Alertas -->
        <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 text-xs px-4 py-3 rounded-lg font-medium">{{ error }}</div>
        <div *ngIf="exito" class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs px-4 py-3 rounded-lg font-medium">✓ Guardado correctamente.</div>

        <!-- El fieldset se deshabilita SOLO si ya hay una campaña creada/seleccionada -->
        <fieldset [disabled]="campanaCreadaId !== null" class="space-y-4 m-0 p-0 border-none disabled:opacity-80">
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1.5">Nombre de Campaña</label>
            <input type="text" [(ngModel)]="form.nombre" placeholder="Ej: Migraciones Junio"
                   class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all disabled:bg-slate-100 disabled:text-slate-500" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1.5">Línea</label>
            <div class="relative">
              <select [(ngModel)]="form.lineaId" class="appearance-none w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all disabled:bg-slate-100 disabled:text-slate-500 pr-10">
                <option [value]="0">Seleccione línea...</option>
                <option *ngFor="let l of lineas" [value]="l.id">{{ l.nombre }}</option>
              </select>
              <svg class="absolute right-3.5 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-1.5">Mes</label>
              <div class="relative">
                <select [(ngModel)]="form.mes" class="appearance-none w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all disabled:bg-slate-100 disabled:text-slate-500 pr-10">
                  <option *ngFor="let m of meses" [value]="m.valor">{{ m.label }}</option>
                </select>
                <svg class="absolute right-3.5 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-1.5">Año</label>
              <div class="relative">
                <select [(ngModel)]="form.anio" class="appearance-none w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all disabled:bg-slate-100 disabled:text-slate-500 pr-10">
                  <option *ngFor="let a of anios" [value]="a">{{ a }}</option>
                </select>
                <svg class="absolute right-3.5 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1.5">Objetivo Total</label>
            <input type="number" [(ngModel)]="form.objetivoTotal" placeholder="0"
                   class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all disabled:bg-slate-100 disabled:text-slate-500" />
          </div>

          <button *ngIf="!campanaCreadaId" (click)="guardar()" [disabled]="guardando || formInvalido"
                  class="w-full bg-slate-900 text-white font-semibold py-3 rounded-lg transition-colors hover:bg-slate-800 disabled:opacity-50 disabled:pointer-events-none text-sm shadow-sm mt-2">
            {{ guardando ? 'Guardando...' : 'Crear Campaña' }}
          </button>
        </fieldset>
      </div>
    </div>

    <!-- COLUMNA 2: GESTIÓN DE PRODUCTOS -->
    <div class="space-y-6">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden transition-all duration-300"
           [ngClass]="{'opacity-40 grayscale pointer-events-none select-none': !campanaCreadaId}">
        
        <div class="p-4 border-b border-slate-200 bg-slate-50/70">
          <h2 class="font-bold text-sm uppercase tracking-wider text-slate-600">2. Productos en Campaña</h2>
        </div>

        <div class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1.5">Nombre del Producto</label>
            <input type="text" [(ngModel)]="nuevoProducto.nombre" placeholder="Ej: Plan Internet 500MB"
                   class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all" />
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1.5">Descripción</label>
            <textarea [(ngModel)]="nuevoProducto.descripcion" placeholder="Detalles o especificaciones cortas..." rows="2"
                      class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all resize-none"></textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1.5">Precio</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold text-sm">S/</span>
              <input type="number" [(ngModel)]="nuevoProducto.precio" placeholder="0.00"
                     class="w-full border border-slate-200 rounded-lg pl-9 pr-3.5 py-2.5 text-sm bg-white text-slate-800 focus:outline-none focus:border-slate-900 focus:ring-[3px] focus:ring-indigo-500/10 transition-all" />
            </div>
          </div>

          <button (click)="agregarProducto()" [disabled]="!nuevoProducto.nombre"
                  class="w-full bg-slate-950 text-white font-semibold py-3 rounded-lg transition-colors hover:bg-slate-800 disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2 text-sm shadow-sm mt-2">
            <span>+ Agregar Producto</span>
          </button>
        </div>

        <!-- Lista de productos añadidos -->
        <div class="p-5 bg-slate-50/50 border-t border-slate-200" *ngIf="productosAgregados.length > 0">
          <div class="space-y-2.5 max-h-[280px] overflow-y-auto custom-scrollbar pr-1">
            <div *ngFor="let p of productosAgregados" class="flex justify-between items-center p-3.5 bg-white border border-slate-200 rounded-lg shadow-sm">
              <div class="min-w-0 flex-1 pr-3">
                <p class="text-sm font-bold text-slate-800 truncate m-0">{{ p.nombre }}</p>
                <p class="text-xs text-slate-400 truncate m-0 mt-0.5" *ngIf="p.descripcion">{{ p.descripcion }}</p>
              </div>
              <span class="text-sm font-bold text-indigo-600 shrink-0 bg-indigo-50/60 border border-indigo-100/80 px-2.5 py-1 rounded-md">
                S/ {{ p.precio | number:'1.2-2' }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
