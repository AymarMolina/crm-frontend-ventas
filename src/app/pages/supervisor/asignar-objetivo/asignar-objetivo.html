<!-- Spinner -->
<div *ngIf="loading" class="flex justify-center items-center min-h-screen">
  <span class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></span>
</div>

<div *ngIf="!loading" class="p-6 bg-gray-50 min-h-screen">

  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Asignar Objetivo</h1>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 max-w-xl">

    <div class="p-6 border-b border-gray-100">
      <h2 class="font-semibold text-gray-700">Nuevo objetivo</h2>
      <p class="text-sm text-gray-400 mt-1">Asigna meta de ventas y comisión a un agente de tu equipo</p>
    </div>

    <div class="p-6 space-y-5">

      <!-- Alerta error -->
      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg">
        {{ error }}
      </div>

      <!-- Alerta éxito -->
      <div *ngIf="exito" class="bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg">
        ✓ Objetivo asignado correctamente.
      </div>

      <!-- Agente -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Agente</label>
        <select
          [(ngModel)]="form.usuarioId"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="">Selecciona un agente</option>
          <option *ngFor="let agente of agentes" [value]="agente.id">
            {{ agente.nombres }} {{ agente.apellidos }}
          </option>
        </select>
      </div>

      <!-- Campaña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Campaña</label>
        <select
          [(ngModel)]="form.campanaId"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="">Selecciona una campaña</option>
          <option *ngFor="let c of campanas" [value]="c.id">
            {{ c.nombre }}
          </option>
        </select>
      </div>

      <!-- Objetivo de ventas -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Objetivo de ventas</label>
        <input
          type="number"
          [(ngModel)]="form.objetivoVentas"
          min="1"
          placeholder="Ej: 20"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <p class="text-xs text-gray-400 mt-1">Número de ventas que debe alcanzar el agente en el mes</p>
      </div>

      <!-- Monto comisión -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Comisión máxima (S/)</label>
        <input
          type="number"
          [(ngModel)]="form.montoComision"
          min="0"
          step="0.01"
          placeholder="Ej: 1000.00"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <p class="text-xs text-gray-400 mt-1">Monto que gana el agente si llega al 100% del objetivo</p>
      </div>

      <!-- Botón -->
      <button
        (click)="guardar()"
        [disabled]="guardando || !form.usuarioId || !form.campanaId || form.objetivoVentas <= 0"
        class="...">
        {{ guardando ? 'Guardando...' : 'Asignar objetivo' }}
        </button>

    </div>
  </div>
</div>
