<nav class="fixed top-0 left-0 right-0 z-[100] h-[60px] flex items-center justify-between px-6 bg-white border-b border-slate-200 shadow-xs">
  
  <!-- ── SECCIÓN IZQUIERDA: BRANDING INSTITUCIONAL ────────────────────── -->
  <div class="flex items-center min-w-[200px]">
    <div class="shrink-0 flex items-center">
      <img 
        src="/logo.png" 
        alt="Logo CRM" 
        class="h-8 w-auto object-contain" 
      />
    </div>
  </div>

  <!-- ── SECCIÓN DERECHA: ALERTAS Y SESIÓN DE AUDITORÍA ────────────────── -->
  <div class="flex items-center gap-4">
    
    <!-- Módulo de Notificaciones / Alertas Operativas -->
    <div class="relative">
      <button 
        class="relative w-8 h-8 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center cursor-pointer text-slate-500 transition-colors duration-150 hover:bg-slate-100 hover:text-slate-800 focus:outline-none" 
        (click)="toggleNotif($event)" 
        [ngClass]="{'bg-slate-100 border-slate-300 text-slate-900': showNotif}">
        
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        
        <!-- Badge de Conteo de Alertas Críticas -->
        <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-red-500 text-white text-[9px] font-bold flex items-center justify-center border border-white tabular-nums" *ngIf="alertas.length > 0">
          {{ alertas.length }}
        </span>
      </button>

      <!-- Dropdown: Panel Desplegable de Alertas -->
      <div class="absolute top-[calc(100%+8px)] right-0 w-80 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden z-50 animate-[dropIn_0.15s_ease]" *ngIf="showNotif">
        
        <!-- Cabecera Dropdown -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 bg-slate-50 text-xs font-bold text-slate-700">
          <span>Alertas de Consistencia</span>
          <span class="bg-teal-50 text-teal-700 border border-teal-200 text-[10px] font-bold px-1.5 py-0.5 rounded-full tabular-nums">
            {{ alertas.length }}
          </span>
        </div>
        
        <!-- State: Sin Alertas Activas -->
        <div class="flex flex-col items-center justify-center py-8 text-slate-400 gap-2 bg-white" *ngIf="alertas.length === 0">
          <svg class="w-7 h-7 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-xs font-medium italic">Sin alertas pendientes de revisión</p>
        </div>
        
        <!-- Listado de Alertas -->
        <div class="max-h-64 overflow-y-auto divide-y divide-slate-100 bg-white">
          <div class="flex items-start gap-3 px-4 py-3 transition-colors hover:bg-slate-50/80 cursor-pointer" 
               *ngFor="let v of alertas"
               (click)="irAAlertas()">
            <div class="w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0 mt-1.5"></div>
            <div class="flex-1 min-w-0 text-xs">
              <p class="font-bold text-slate-900 tracking-tight">{{ v.codigoVenta }}</p>
              <p class="text-slate-600 font-semibold truncate mt-0.5">{{ v.clienteNombre }}</p>
              <p class="text-[11px] text-slate-400 font-medium mt-0.5 leading-normal">{{ v.alertaDetalle }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Separador Estructural Plano -->
    <div class="w-px h-6 bg-slate-200"></div>

    <!-- Módulo de Identidad del Usuario Logueado -->
    <div class="flex items-center gap-3">
      
      <!-- Avatar de Identidad Plano -->
      <div class="w-8 h-8 rounded-lg bg-slate-900 text-white text-xs font-bold flex items-center justify-center shrink-0 border border-slate-950 shadow-xs uppercase">
        {{ iniciales }}
      </div>
      
      <!-- Metadatos de Rol Corporativo -->
      <div class="flex flex-col text-left">
        <span class="text-xs font-bold text-slate-800 tracking-tight leading-tight">{{ nombres }}</span>
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">{{ rolDisplay }}</span>
      </div>
      
      <!-- Botón de Desconexión Segura / Logout -->
      <button class="w-7 h-7 rounded-lg border border-slate-200 bg-transparent flex items-center justify-center cursor-pointer text-slate-400 transition-colors duration-150 hover:bg-red-50 hover:border-red-200 hover:text-red-600 focus:outline-none shadow-xs" 
              (click)="logout()" 
              title="Cerrar sesión de forma segura">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>

    </div>
    
  </div>
</nav>
