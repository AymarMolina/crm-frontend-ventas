<nav class="fixed top-0 left-0 right-0 z-[100] h-[60px] flex items-center justify-between px-6 bg-white border-b border-gray-200 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
  
  <!-- Brand -->
  <div class="flex items-center gap-3 min-w-[200px]">
    <div>
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="1" y="1" width="9" height="9" rx="2" fill="#2563EB"/>
        <rect x="12" y="1" width="9" height="9" rx="2" fill="#2563EB" opacity="0.4"/>
        <rect x="1" y="12" width="9" height="9" rx="2" fill="#2563EB" opacity="0.4"/>
        <rect x="12" y="12" width="9" height="9" rx="2" fill="#2563EB"/>
      </svg>
    </div>
    <!-- Nota: Usa font-sans por defecto. Si configuraste DM Sans en tu tailwind.config.js, usa esa familia -->
    <span class="font-sans font-bold text-[1.05rem] text-gray-900 tracking-[-0.3px]">CRM</span>
  </div>

  <!-- Right section -->
  <div class="flex items-center gap-4">
    
    <!-- Notificaciones -->
    <div class="relative">
      <button 
        class="relative w-9 h-9 rounded-[10px] border border-gray-200 bg-gray-50 flex items-center justify-center cursor-pointer text-gray-500 transition-all duration-150 hover:bg-blue-50 hover:border-blue-200 hover:text-blue-600" 
        (click)="toggleNotif($event)" 
        [ngClass]="{'bg-blue-50 border-blue-200 text-blue-600': showNotif}">
        
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="absolute -top-1 -right-1 w-[17px] h-[17px] rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center border-2 border-white" *ngIf="alertas.length > 0">
          {{ alertas.length }}
        </span>
      </button>

      <!-- Dropdown notificaciones -->
      <div class="absolute top-[calc(100%+10px)] right-0 w-[320px] bg-white border border-gray-200 rounded-[14px] shadow-[0_10px_40px_rgba(0,0,0,0.12)] overflow-hidden animate-[dropIn_0.15s_ease]" *ngIf="showNotif">
        
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-100 text-[0.82rem] font-semibold text-gray-700">
          <span>Alertas activas</span>
          <span class="bg-blue-50 text-blue-600 text-[11px] font-bold px-[7px] py-[2px] rounded-full">{{ alertas.length }}</span>
        </div>
        
        <div class="flex flex-col items-center justify-center py-6 text-gray-400 gap-2" *ngIf="alertas.length === 0">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <p class="text-sm">Sin alertas pendientes</p>
        </div>
        
        <div class="flex items-start gap-2.5 px-4 py-3 border-b border-gray-50 transition-colors duration-100 hover:bg-gray-50 cursor-pointer" 
             *ngFor="let v of alertas"
             (click)="irAAlertas()">
          <div class="w-2 h-2 rounded-full bg-amber-500 shrink-0 mt-1"></div>
          <div>
            <p class="text-[0.8rem] font-semibold text-gray-900">{{ v.codigoVenta }}</p>
            <p class="text-[0.75rem] text-gray-500">{{ v.clienteNombre }}</p>
            <p class="text-[0.72rem] text-gray-400 mt-0.5">{{ v.alertaDetalle }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Separador -->
    <div class="w-px h-7 bg-gray-200"></div>

    <!-- Usuario -->
    <div class="flex items-center gap-[10px]">
      <div class="w-[34px] h-[34px] rounded-[10px] bg-gradient-to-br from-blue-600 to-blue-700 text-white text-xs font-bold flex items-center justify-center">
        {{ iniciales }}
      </div>
      <div class="flex flex-col">
        <span class="text-[0.82rem] font-semibold text-gray-900 leading-[1.2]">{{ nombres }}</span>
        <span class="text-[0.7rem] text-gray-500 font-medium">{{ rolDisplay }}</span>
      </div>
      <button class="w-[30px] h-[30px] rounded-lg border border-gray-200 bg-transparent flex items-center justify-center cursor-pointer text-gray-400 transition-all duration-150 hover:bg-red-50 hover:border-red-200 hover:text-red-500" 
              (click)="logout()" 
              title="Cerrar sesión">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
    
  </div>
</nav>
