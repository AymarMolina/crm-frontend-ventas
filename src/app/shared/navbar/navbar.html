<nav class="navbar">
  <div class="navbar__brand">
    <div class="navbar__logo-mark">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="1" y="1" width="9" height="9" rx="2" fill="#2563EB"/>
        <rect x="12" y="1" width="9" height="9" rx="2" fill="#2563EB" opacity="0.4"/>
        <rect x="1" y="12" width="9" height="9" rx="2" fill="#2563EB" opacity="0.4"/>
        <rect x="12" y="12" width="9" height="9" rx="2" fill="#2563EB"/>
      </svg>
    </div>
    <span class="navbar__brand-name">CRM</span>
  </div>

  <div class="navbar__right">
    <!-- Notificaciones -->
    <div class="navbar__notif-wrap">
      <button class="navbar__icon-btn" (click)="toggleNotif($event)" [class.active]="showNotif">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="navbar__badge" *ngIf="alertas.length > 0">{{ alertas.length }}</span>
      </button>

      <!-- Dropdown notificaciones -->
      <div class="notif-dropdown" *ngIf="showNotif">
        <div class="notif-dropdown__header">
          <span>Alertas activas</span>
          <span class="notif-count">{{ alertas.length }}</span>
        </div>
        <div class="notif-dropdown__empty" *ngIf="alertas.length === 0">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <p>Sin alertas pendientes</p>
        </div>
        <!-- Dentro de notif-item, reemplaza el div wrapper por: -->
        <div class="notif-item" *ngFor="let v of alertas"
            (click)="irAAlertas()"
            style="cursor:pointer">
          <div class="notif-item__dot"></div>
          <div>
            <p class="notif-item__title">{{ v.codigoVenta }}</p>
            <p class="notif-item__sub">{{ v.clienteNombre }}</p>
            <p class="notif-item__detail">{{ v.alertaDetalle }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Separador -->
    <div class="navbar__sep"></div>

    <!-- Usuario -->
    <div class="navbar__user">
      <div class="navbar__avatar">{{ iniciales }}</div>
      <div class="navbar__user-info">
        <span class="navbar__user-name">{{ nombres }}</span>
        <span class="navbar__user-rol">{{ rolDisplay }}</span>
      </div>
      <button class="navbar__logout" (click)="logout()" title="Cerrar sesión">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</nav>
